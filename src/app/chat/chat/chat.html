<section class="chat-page">

  <!-- =========================================================
       EN-TÊTE
       ========================================================= -->
  <div class="chat-header">
    <a routerLink="/client/amis" class="btn-back">
      <i class="bi bi-arrow-left"></i>
    </a>

    <div class="friend-thumb" *ngIf="friend">
      <img *ngIf="hasAvatar(friend)" [src]="getAvatarUrl(friend)" [alt]="friend.name">
      <span *ngIf="!hasAvatar(friend)" [style.background]="getGradient(friend.name)">
        {{ getInitials(friend.name) }}
      </span>
    </div>

    <div class="friend-name">
      <h2>{{ friend?.name || 'Discussion' }}</h2>
      <span class="status">Ami</span>
    </div>
  </div>

  <!-- =========================================================
       MESSAGES
       ========================================================= -->
  <div class="chat-body" *ngIf="!isLoading">

    <div class="empty-chat" *ngIf="messages.length === 0">
      <i class="bi bi-chat-dots"></i>
      <p>Envoyez votre premier message</p>
    </div>

    <div class="messages" *ngIf="messages.length > 0">
      <div class="message-row"
           *ngFor="let m of messages"
           [class.mine]="isMine(m)">

        <div class="bubble">
          <p>{{ m.content }}</p>

          <div class="bubble-footer">
            <span class="time">{{ formatTime(m.createdAt) }}</span>

            <!-- Coches uniquement sur MES messages -->
            <span class="check" *ngIf="isMine(m)">

              <!-- En cours d'envoi -->
              <i class="bi bi-clock sending" *ngIf="isSendingMsg(m)"></i>

              <!-- Lu : double coche -->
              <i class="bi bi-check2-all read"
                 *ngIf="!isSendingMsg(m) && isRead(m)"></i>

              <!-- Envoyé, non lu : coche simple -->
              <i class="bi bi-check2"
                 *ngIf="!isSendingMsg(m) && !isRead(m)"></i>

            </span>
          </div>
        </div>

      </div>

      <div #messagesEnd></div>
    </div>

  </div>

  <!-- =========================================================
       SAISIE
       ========================================================= -->
  <div class="chat-input">
    <input
      type="text"
      [(ngModel)]="newMessage"
      (keyup.enter)="send()"
      placeholder="Écrire un message…"
      maxlength="1000"
      [disabled]="isSending">

    <button (click)="send()" [disabled]="!newMessage.trim() || isSending">
      <i class="bi" [class.bi-send-fill]="!isSending" [class.bi-hourglass-split]="isSending"></i>
    </button>
  </div>

</section>
